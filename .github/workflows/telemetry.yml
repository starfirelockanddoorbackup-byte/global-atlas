name: Telemetry pull
on:
  schedule:
    - cron: '17 */4 * * *'   # every 4 hours
  workflow_dispatch: {}
  push:
    paths: ['scripts/update.mjs', 'scripts/extra.mjs', '.github/workflows/telemetry.yml']
permissions:
  contents: write
concurrency: { group: telemetry, cancel-in-progress: false }
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/update.mjs
      - name: Commit telemetry
        run: |
          git config user.name "atlas-telemetry"
          git config user.email "atlas-telemetry@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || (git commit -m "Telemetry $(date -u +%Y-%m-%dT%H:%MZ)" && git pull --rebase -X theirs && git push)
